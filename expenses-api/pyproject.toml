[project]
name = "expenses-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-langgraph>=0.0.27",
    "aiomysql==0.2.0",
    "alembic==1.15.1",
    "copilotkit>=0.1.81",
    "cryptography==44.0.0",
    "fastapi[standard]>=0.135.1",
    "fastmcp>=2.0,<3",
    "httpx>=0.27.0",
    "langchain-core>=1.4.0",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=1.0.10",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "pyjwt[crypto]>=2.13.0",
    "pymysql==1.1.1",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.46",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "langgraph-cli[inmem]>=0.4.18",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
